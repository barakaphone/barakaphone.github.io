<style>
:root{
  --bg:#F3F5F9; --surface:#fff; --surface2:#F5F7FB; --ink:#141C2E; --muted:#5F6B82; --line:#DCE2EC;
  --g:#00297D; --gDark:#001E5C; --gSoft:#EAF0FA; --gLine:#C5D2EC;
  --y:#E8B921; --ySoft:#FDF5D9; --yLine:#F1D77F; --yDeep:#C99A0A;
  --ok:#1E8A4C; --okSoft:#E3F4EA; --bad:#C8372D; --badSoft:#FBEAE8; --warn:#B7791F; --warnSoft:#FCF3E2;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg) linear-gradient(180deg,#E9EEF8 0,var(--bg) 260px) no-repeat;color:var(--ink);font:16px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
h1,h2,h3,.qt,.hero b,.total b,.price-top b,.sltop b,.kv .v,.mo b{font-family:"Poppins","Golos Text",system-ui,sans-serif}
.hidden{display:none!important}

/* auth */
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.authbox{width:100%;max-width:420px;background:var(--surface);border-radius:18px;padding:28px;box-shadow:0 10px 40px rgba(0,41,125,.12);border-top:5px solid var(--y)}
.authbox img{height:52px;display:block;margin:0 auto 18px}
.authbox h2{text-align:center;margin:0 0 4px;color:var(--g)}
.authbox .sub{text-align:center;color:var(--muted);margin:0 0 18px}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:3px solid var(--y);box-shadow:0 2px 12px rgba(0,41,125,.06)}
.bar-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.bar-in img{height:40px}
.bar-in .who{margin-left:auto;text-align:right;font-size:13px;color:var(--muted);line-height:1.3}
.bar-in .who b{display:block;color:var(--ink);font-size:14px}
.tabs{max-width:860px;margin:0 auto;display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto}
.tabs button{border:1.5px solid var(--line);background:transparent;padding:8px 16px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap;position:relative}
.tabs button.on{background:var(--g);border-color:var(--g);color:#fff}
.tabs button.on::after{content:"";position:absolute;left:50%;bottom:-7px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--y)}
.page{max-width:860px;margin:0 auto;padding:18px 16px 130px}

/* common */
.field{margin-bottom:14px}
.field>label,.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:50px;box-shadow:0 1px 3px rgba(0,41,125,.05)}
.inp:focus{border-color:var(--g);outline:none;box-shadow:0 0 0 3px var(--gSoft)}
.inp.err{border-color:var(--bad)}
.ro{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:13px 14px;font-weight:500}
.btn{border:0;border-radius:12px;min-height:52px;padding:0 20px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--g);color:#fff;box-shadow:0 4px 14px rgba(0,41,125,.25)}
.btn.pri:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.sec{background:var(--surface);border:1px solid var(--gLine);color:var(--g)}
.btn.gold{background:var(--y);color:var(--g)}
.btn.red{background:var(--bad);color:#fff;box-shadow:0 4px 14px rgba(200,55,45,.25)}
.btn.green{flex:1;background:#1E9A4C;color:#fff;box-shadow:0 4px 14px rgba(30,154,76,.3)}
.btn.green:disabled,.btn.red:disabled{opacity:.5}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:9px}
.btn.block{width:100%}
.err{background:var(--badSoft);color:var(--bad);border-radius:12px;padding:12px 14px;font-weight:600;margin:12px 0}
.note{background:var(--ySoft);border:1px solid var(--yLine);border-radius:12px;padding:12px 14px;font-size:15px;margin:12px 0}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
.showpw{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:-4px 0 12px}
h3{font-size:19px;margin:24px 0 10px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--gSoft);color:var(--g)}
.badge.A{background:var(--okSoft);color:var(--ok)}.badge.B{background:var(--warnSoft);color:var(--warn)}.badge.C,.badge.D{background:var(--badSoft);color:var(--bad)}
.badge.ok{background:var(--okSoft);color:var(--ok)}.badge.bad{background:var(--badSoft);color:var(--bad)}.badge.grey{background:var(--surface2);color:var(--muted)}.badge.gold{background:var(--ySoft);color:var(--yDeep)}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.loading{padding:30px;text-align:center;color:var(--muted)}

/* stepper */
.stepper{display:flex;align-items:flex-start;margin:4px 0 20px}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:13px;color:var(--muted);text-align:center}
.st:not(:last-child)::after{content:"";position:absolute;top:15px;left:calc(50% + 20px);right:calc(-50% + 20px);height:2px;background:var(--line)}
.st.done:not(:last-child)::after{background:var(--y)}
.st .c{width:32px;height:32px;border-radius:50%;background:var(--line);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:14px;position:relative;z-index:1;font-family:Poppins,sans-serif}
.st.on .c{background:var(--g);color:#fff;box-shadow:0 0 0 4px #fff,0 0 0 6px var(--y)}
.st.done .c{background:var(--y);color:var(--g)}
.st.on{color:var(--g);font-weight:600}

/* questions */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.prog{flex:1;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--y);transition:width .25s}
.qcount{font-size:14px;color:var(--muted)}
.qback{border:0;background:transparent;padding:4px 0;font-weight:600;color:var(--g);text-decoration:underline;text-underline-offset:3px;margin-bottom:8px}
.qt{font-size:24px;line-height:1.25;margin:0 0 6px;color:var(--g)}
.qhint{color:var(--muted);margin:0 0 14px;font-size:15px}
.olist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-size:17px;font-weight:500;min-height:58px;box-shadow:0 1px 3px rgba(0,41,125,.05)}
.opt:active{transform:scale(.99)}
.opt.on{background:var(--g);border-color:var(--g);color:#fff}
.opt.on::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:6px;border-radius:12px 0 0 12px;background:var(--y)}
.opt small{color:var(--muted);font-size:13px}.opt.on small{color:var(--y)}
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.vcard{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px;gap:8px;box-shadow:0 1px 3px rgba(0,41,125,.05);transition:border-color .15s,box-shadow .15s}
.vcard:active{transform:scale(.995)}
.vcard .vimg{display:block;border-radius:10px;overflow:hidden;background:#EEF2F8;aspect-ratio:420/270}
.vcard svg{display:block;width:100%;height:100%}
.vcard .vtxt{display:flex;flex-direction:column;gap:3px;padding:2px 6px 6px}
.vcard .vtxt b{font:600 16px Poppins,sans-serif;color:var(--ink)}
.vcard .vtxt span{font-size:14px;color:var(--muted);line-height:1.35}
.vcard .vtxt small{font-size:12px;color:var(--muted);margin-top:2px}
.vcard.on{border-color:var(--g);box-shadow:0 0 0 2px var(--g);background:var(--gSoft)}
.vcard.on .vtxt b{color:var(--g)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.ogrid .opt{justify-content:center;text-align:center}
.ogrid .opt.on::before{display:none}
@media (max-width:640px){.vcards{grid-template-columns:1fr}}
.mlist{margin-top:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);max-height:min(56vh,520px);overflow-y:auto}
.mlist button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 16px;font-size:17px;border-bottom:1px solid var(--line)}
.mlist button:last-child{border-bottom:0}
.mlist button.on{background:var(--g);color:#fff}
.bigin{display:flex;align-items:center;gap:16px;margin-top:18px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px}
.bigin input[type=range]{flex:1}
.bigin .bv{display:flex;align-items:baseline;gap:4px;margin:0 auto}
.bigin .bv input{width:120px;font:700 38px Poppins,sans-serif;border:0;background:transparent;text-align:right;padding:0;color:var(--g)}
.bigin .bv span{font-size:22px;font-weight:700}

/* slider */
.slcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px 14px}
.sltop{display:flex;justify-content:space-between;align-items:baseline}
.sltop .t{color:var(--muted);font-size:14px}.sltop b{font-size:26px}
input.rng{-webkit-appearance:none;appearance:none;display:block;width:100%;height:6px;margin:18px 0 12px;border-radius:999px;background:linear-gradient(to right,var(--y) var(--p,0%),#DCE2EC var(--p,0%));cursor:pointer}
input.rng::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--g);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
input.rng::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--g);border:3px solid #fff}
.slends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

/* hero & cards */
.hero{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--y);border-radius:14px;padding:12px 14px;margin-bottom:18px}
.hero .ic{width:44px;height:44px;border-radius:11px;background:var(--g);color:var(--y);display:grid;place-items:center;font-size:20px;flex:none}
.hero b{display:block;color:var(--g);font-size:18px}.hero span{color:var(--muted);font-size:14px}
.price{margin-top:18px;background:var(--g);color:#fff;border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,41,125,.22);position:relative;overflow:hidden}
.price::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(232,185,33,.16);pointer-events:none}
.price-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.price-top .ic{width:40px;height:40px;border-radius:50%;background:var(--y);color:var(--g);display:grid;place-items:center;font-weight:800;flex:none}
.price-top small{display:block;color:rgba(255,255,255,.7);font-size:13px}
.price-top .usd{margin-left:auto;background:rgba(255,255,255,.1);border:1px solid rgba(232,185,33,.6);color:var(--y);border-radius:8px;padding:4px 10px;font-weight:700}
.total{position:relative;z-index:1;margin-top:14px;background:var(--surface);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.total span{color:var(--muted);font-size:17px}.total b{color:var(--g);font-size:28px;white-space:nowrap}
.deds{list-style:none;margin:12px 0 0;padding:0;font-size:14px;color:rgba(255,255,255,.78);position:relative;z-index:1}
.deds li{display:flex;justify-content:space-between;gap:10px;padding:2px 4px}
.extra{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 4px;margin-top:14px}
.extra>div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:0 6px}
.extra>div+div{border-left:1px solid var(--line)}
.extra .t{font-size:13px;color:var(--muted)}.extra b{font-size:17px;font-family:Poppins,sans-serif;white-space:nowrap}
.pill{border:1.5px solid var(--y);border-radius:8px;padding:3px 10px;font-weight:600;font-size:14px;color:var(--g)}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}
.scale div{font-size:12px;text-align:center;padding:6px 2px;border-radius:7px;background:var(--surface2);color:var(--muted)}
.scale div.on{background:var(--y);color:var(--g);font-weight:700}
.ptsbox{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ptsbox ul{list-style:none;margin:6px 0 0;padding:0;font-size:15px}
.ptsbox li{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:3px}
.card.on{border-color:var(--g);box-shadow:0 0 0 2px var(--g);background:var(--gSoft)}
.card b{font-size:16px}
.card.other{background:var(--surface2);border-style:dashed}
.card.other .p{color:var(--muted)}.card .m{font-size:14px;color:var(--muted)}
.card .p{margin-top:6px;font-weight:700;font-size:18px;white-space:nowrap}
.compare{display:grid;grid-template-columns:1fr auto 1fr auto 1.1fr;gap:8px;align-items:center;margin-top:16px}
.compare .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.compare .box.hl{background:var(--g);border-color:var(--g);color:#fff}
.compare .k{font-size:13px;opacity:.75}.compare .v{font-weight:700;font-size:18px;white-space:nowrap}
.compare .box.hl .v{color:var(--y)}
.compare .op{font-size:22px;font-weight:700;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ph{position:relative;aspect-ratio:3/4;border:1.5px dashed var(--yLine);background:var(--surface);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;text-align:center;padding:8px;cursor:pointer}
.ph .plus{width:44px;height:44px;border-radius:50%;background:var(--ySoft);color:var(--yDeep);display:grid;place-items:center;font-size:26px}
.ph span{font-size:15px;color:var(--muted)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .lab{position:absolute;left:6px;bottom:6px;background:rgba(0,20,60,.7);color:#fff;font-size:12px;padding:2px 8px;border-radius:6px}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kv>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kv .k{font-size:13px;color:var(--muted)}.kv .v{font-size:18px;font-weight:700;white-space:nowrap}
.kv .big{grid-column:1/-1;background:var(--g);border-color:var(--g)}
.kv .big .k{color:rgba(255,255,255,.7)}.kv .big .v{color:var(--y);font-size:24px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{background:var(--gSoft);color:var(--g);font-size:13px}
tr:last-child td{border-bottom:0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.item .src{font-size:13px;color:var(--muted)}
.item .p{font:700 17px Poppins,sans-serif;white-space:nowrap;color:var(--g)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
details summary{cursor:pointer;color:var(--g);font-weight:600;margin-top:8px;font-size:14px}
.action{position:fixed;left:0;right:0;bottom:0;z-index:15;background:linear-gradient(to top,var(--bg) 65%,rgba(243,245,249,0));padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.action-in{max-width:860px;margin:0 auto;display:flex;gap:10px}
.action .pri{flex:1}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,45,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--surface);border-radius:16px;padding:22px;width:100%;max-width:500px;max-height:92vh;overflow:auto;border-top:5px solid var(--y)}
.mbox h2{margin:0 0 4px;color:var(--g)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--g);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;border-bottom:3px solid var(--y);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--bad)}
.done-ic{width:76px;height:76px;border-radius:50%;background:var(--y);color:var(--g);display:grid;place-items:center;font-size:40px;margin:10px auto 14px;font-weight:700}
.kv>div{min-width:0}
@media (max-width:640px){
  .kv .v{white-space:normal;word-break:break-word}
  .action .btn{font-size:15px;padding:0 12px}
  .tabs{gap:4px;padding:0 10px 12px}
  .tabs button{flex:1;padding:8px 6px;font-size:14px}
  .page{padding:14px 12px 130px}
  .qt{font-size:21px}
  .compare{grid-template-columns:1fr}.compare .op{display:none}
  .st{font-size:11px}
  .bar-in img{height:34px}
  .total b{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ver{text-align:center;font-size:12px;color:var(--muted);margin:12px 0 0}
.tabs .badge{font-size:11px;padding:1px 6px;margin-left:2px}
@media (max-width:440px){.tabs button{font-size:13px;padding:8px 3px}.tabs{gap:3px;padding:0 6px 12px}}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px}
.sgrid>div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.sgrid .k{font-size:12px;color:var(--muted)}.sgrid b{display:block}
.sgrid .hl{background:var(--g);border-color:var(--g);color:#fff}.sgrid .hl .k{color:rgba(255,255,255,.7)}.sgrid .hl b{color:var(--y)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:500px){.row2{grid-template-columns:1fr}}
.imeires{display:flex;flex-direction:column;gap:8px;margin:-4px 0 14px}
.imeires>div{background:var(--surface);border:1.5px solid var(--y);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5}
.bphotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bph{position:relative;aspect-ratio:3/4;border:1.5px dashed var(--yLine);border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.bphotos.view .bph{border-style:solid;border-color:var(--line)}
.bph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bph .guide{width:78%;height:auto;margin-bottom:18px}
.bph .cam{position:absolute;top:6px;right:6px;font-size:15px;opacity:.75}
.bph .lab{position:absolute;left:4px;right:4px;bottom:4px;background:rgba(0,20,60,.72);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;text-align:center}
.bph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.bchk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:var(--surface)}
.bchk input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:#00297D}
.bph.pass{aspect-ratio:16/10;max-width:300px}
.bph .pico{font-size:42px;margin-bottom:18px;opacity:.8}
@media (max-width:500px){.bphotos{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function battAdj(m, a, s) {
  const r = Math.round, out = [], bp = s.battPct ?? 1, cp = s.cycPct ?? 1, batt = a.batt ?? 100;
  const bd = Math.min(50, Math.max(0, 100 - batt) * bp); if (bd > 0) out.push([`Batareya ${batt}%`, r(bd * 100) / 100]);
  if (hasCycles(m) && a.cyc != null && a.cyc !== "") { const cd = Math.min(50, Math.max(0, +a.cyc) / 100 * cp); if (cd > 0) out.push([`Batareya sikli: ${a.cyc}`, r(cd * 100) / 100]); }
  return out;
}
function calcTradein(m, mem, a, s) {
  const mi = Math.max(0, m.mems.indexOf(mem));
  const market = m.market + m.step * mi;
  const base = Math.round(market * (100 - s.discPct)) / 100;
  if (a.lock === "on") return {rejected: true, usd: 0, uzs: 0, points: 0, lines: []};
  if (a.power === "no") { const u = Math.round(base * s.partsPct) / 100; return {parts: true, usd: u, uzs: toUzs(u), points: 0, grade: "Ehtiyot qism", gradeLetter: "D", lines: [], sellUsd: Math.round(u * 100 / (100 - s.discPct))}; }
  const lines = []; let pts = 0;
  const QN = {screen: "Ekran", body: "Korpus", bio: "Face ID / Touch ID", cam: "Kamera", repair: "Ta'mir"};
  for (const k of ["screen", "body", "bio", "cam", "repair"]) { const o = (s.pts[k] || []).find(o => o.v === a[k]); if (o && o.p) { pts += o.p; lines.push([QN[k] + ": " + o.label.toLowerCase(), o.p]); } }
  let gi = s.grades.findIndex(g => pts <= g.max); if (gi < 0) gi = s.grades.length - 1;
  // Har bir nuqson (chizilish, qirilish, ta'mir...) narxdan o'z foizini ayiradi; daraja (A'lo...) faqat nom uchun
  let k = 1; lines.forEach(l => k *= 1 - l[1] / 100); if (a.box === "no") k *= 1 - s.noBoxPct / 100;
  // Batareya sig'imi va sikli ham narxga to'g'ridan-to'g'ri ta'sir qiladi
  const adj = battAdj(m, a, s); adj.forEach(x => k *= 1 - x[1] / 100);
  const u = Math.round(base * k * 100) / 100;
  return {usd: u, uzs: toUzs(u), points: pts, gi, grade: s.grades[gi].label, gradeLetter: ["A", "B", "C", "D"][Math.min(gi, 3)], lines, adj, sellUsd: Math.round(u * 100 / (100 - s.discPct))};
}

/* ---- Login: telefon raqami → ichki email. Parol admin tomonidan tiklanganda
   xodimga "+v2", "+v3" ... qo'shimchali yangi ichki login beriladi. ---- */
const MAX_ALIAS = 4;
const emailFor = (phone, k) => k <= 1 ? `${phone}@${LOGIN_DOMAIN}` : `${phone}+v${k}@${LOGIN_DOMAIN}`;
let loggingIn = false;
async function loginWithPhone(input, pw) {
  const raw = digits(input), norm = normPhone(raw), bases = [norm];
  if (norm !== raw) bases.push(raw); else if (raw.length === 12 && raw.startsWith("998")) bases.push(raw.slice(3));
  let last = null, inactive = false;
  loggingIn = true;
  try {
    for (const base of bases) for (let k = 1; k <= MAX_ALIAS; k++) {
      try {
        const cred = await signInWithEmailAndPassword(auth, emailFor(base, k), pw);
        const ps = await getDoc(doc(db, "profiles", cred.user.uid));
        if (ps.exists() && ps.data().active) return cred;
        inactive = true; await signOut(auth);
      } catch (e) {
        if (!/invalid-credential|user-not-found|wrong-password|invalid-email|permission-denied/.test(e.code || "")) throw e;
        last = e;
      }
    }
    throw inactive ? {code: "x-inactive"} : (last || {code: "auth/invalid-credential"});
  } finally { loggingIn = false; }
}

    if (!p.branchId) { await signOut(auth); return loginError("Siz hali filialga biriktirilmagansiz. Admin bilan bog'laning."); }

    const dealRef = doc(collection(db, "deals")), newRef = doc(collection(db, "stock"));

    // Mijoz ma'lumotlari so'ralmaydi — shartnoma raqami bilan ajratiladi

    const b = writeBatch(db);
    b.set(dealRef, {
      branchId: S.me.branchId, sellerId: S.me.id, sellerName: S.me.fullName || "", client, contractNo,
      device: {modelId: m.id, brand: m.brand, name: m.name, mem: W.mem, color: W.color, imei: digits(W.imei), answers: answers(),
               calc: {usd: c.usd, uzs: c.uzs, points: c.points, grade: c.grade, gradeLetter: c.gradeLetter, fv: 5},
               ...(c.manual ? {manual: {uzs: c.uzs, autoUzs: c.autoUzs, reason: W.manual.reason, by: S.me.id, byName: S.me.fullName || ""}} : {})},
      deviceUsd: c.usd, deviceUzs: c.uzs, stockId: st.id, ourModel: `${st.modelName} ${st.mem || ""}`.trim(), ourUsd: st.sellUsd, ourUzs: our,
      diffUzs: diff, months, monthlyUzs: p ? p.monthly : 0, totalUzs: p ? p.total : 0, kurs, newStockId: newRef.id, photoCount,
      schedule: p ? schedule(p, months) : [], createdAt: serverTimestamp()});
    b.update(doc(db, "stock", st.id), {status: "sotilgan", sold: {kind: "deal", ref: dealRef.id, at: serverTimestamp(), clientName: client.name, priceUzs: our}, updatedAt: serverTimestamp()});
    b.set(newRef, {branchId: S.me.branchId, modelName: m.name, brand: m.brand, mem: W.mem, color: W.color, imei: digits(W.imei), grade: c.gradeLetter || "D",
      battery: W.batt, cyc: hasCycles(m) && W.cyc != null ? W.cyc : null, box: W.box || "", buyUsd: c.usd, sellUsd: c.sellUsd, status: "tayyorlanmoqda", source: "trade-in", sourceDealId: dealRef.id,
      createdBy: S.me.id, createdAt: serverTimestamp(), updatedAt: serverTimestamp()});
    await b.commit();
    // Rasmlar — shartnomadan keyin, alohida
    let photoErr = 0;
    for (const [slot, data] of Object.entries(W.photos)) {
      try { await setDoc(doc(collection(db, "photos")), {dealId: dealRef.id, branchId: S.me.branchId, slot: +slot, label: PHOTO_SLOTS[slot], data, createdBy: S.me.id, createdAt: serverTimestamp()}); }
      catch { photoErr++; }

    if (W.arizaId) { try { await setArzStatus(W.arizaId, "yakunlandi", {dealId: dealRef.id}); } catch (e) { console.warn("ariza", e); } }
    W.done = {client: client.name, gave: `${m.name} ${W.mem}`, took: `${st.modelName} ${st.mem || ""}`, diff, months, monthly: p?.monthly, photoErr};
    W.saving = false; await loadAll(); renderWizard(); toast("Shartnoma saqlandi");

/* Rasmni siqish: uzun tomoni 1024px, sifati hajmga qarab */
function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight, max = 1024; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(img, 0, 0, w, h);
      let q = 0.7, out = cv.toDataURL("image/jpeg", q);
      while (out.length > 300000 && q > 0.3) { q -= 0.1; out = cv.toDataURL("image/jpeg", q); }
      URL.revokeObjectURL(url); out.length > 340000 ? rej(new Error("Rasm juda katta")) : res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Rasmni o'qib bo'lmadi")); };
    img.src = url;
  });
}

    bio: a.bio ?? null, cam: a.cam ?? null, repair: a.repair ?? null, box: a.box ?? null, arizaId: x.id, arizaNo: x.no || x.id.slice(0, 6).toUpperCase(),
    // Telefon allaqachon sotib olingan bo'lsa — shartnoma o'sha narx bilan tuziladi
    manual: x.bought?.priceUzs ? {uzs: x.bought.priceUzs, reason: "Sotib olingan narx"} : x.manualUzs ? {uzs: x.manualUzs, reason: x.manualReason || "Admin arizada o'zgartirgan"} : null});
  // Mijoz barcha savollarga javob bergan; xotira hajmi ro'yxatdan o'chirilgan bo'lsa — o'sha savoldan davom etadi
  W.q = W.mem ? SUMMARY : QS.findIndex(q => q.k === "mem");
  if (S.stock.some(s => s.id === x.stockId && s.status === "sotuvda")) W.stockId = x.stockId;
  go("tradein");
}

/* ================= PROFILE ================= */
function renderProfile() {
  $("#page").innerHTML = hero("☺", S.me.fullName || "Xodim", `${esc(S.branch.name)} · +${esc(S.me.login)}`) + `
  <h3>Parolni o'zgartirish</h3>
  <div class="field"><label for="pOld">Hozirgi parol</label><input class="inp" id="pOld" type="password" autocomplete="current-password"></div>
  <div class="field"><label for="pNew">Yangi parol (kamida 6 belgi)</label><input class="inp" id="pNew" type="password" autocomplete="new-password"></div>
  <label class="showpw"><input type="checkbox" id="pShow"> Parolni ko'rsatish</label>
  <div id="pErr" class="err hidden"></div>
  <button class="btn pri" data-act="pwSave">Parolni saqlash</button>
  <h3>Ilovani planshet ekraniga qo'shish</h3>
  <p class="hint">Chrome menyusida (⋮) <b>"Bosh ekranga qo'shish"</b> yoki <b>"Ilovani o'rnatish"</b> ni tanlang — planshet ekranida Baraka belgisi paydo bo'ladi.</p>
  <button class="btn sec block" style="margin-top:24px" data-act="refresh">↻ Ma'lumotlarni yangilash</button>
  <button class="btn sec block" style="margin-top:10px;color:var(--bad);border-color:#F0C2BD" data-act="logout">Chiqish</button>
  <p class="ver">Versiya ${APP_VERSION}</p>`;
}

/* ================= EVENTS ================= */
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t || t.closest(".tabs")) return;
  const a = t.dataset.act;
  if (t.dataset.ans) return answer(t.dataset.ans, t.dataset.v);
  if (a === "qback") { if (W.hist.length) { W.q = W.hist.pop(); renderWizard(); window.scrollTo(0, 0); } return; }
  if (a === "redo") { W.hist = []; W.q = 0; return renderWizard(); }
  if (a === "colorOk") { const v = $("#colorTxt").value.trim(); if (!v) return toast("Rangni yozing yoki ro'yxatdan tanlang"); return answer("color", v); }
  if (a === "colorSkip") return answer("color", "");
  if (a === "battOk") { W.batt = Math.max(1, Math.min(100, Math.round(+$("#battN").value || 0))); return answer("batt", W.batt); }
  if (a === "cycSkip") return answer("cyc", null);
  if (a === "cycOk") { const v = $("#cycN").value; if (v === "") return toast("Sikl sonini kiriting"); return answer("cyc", Math.max(0, Math.round(+v))); }
  if (a === "prev") { W.step--; renderWizard(); window.scrollTo(0, 0); return; }
  if (a === "cancelDeal") {
    modal(`<h2>Rostdan bekor qilasizmi?</h2><p class="hint">Shartnoma tuzilmaydi, kiritilgan javoblar va rasmlar o'chiriladi.</p>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn sec" data-act="cancelNo">Yo'q</button><button class="btn red" data-act="cancelYes">Ha, bekor qilish</button></div>`);
    return;
  }
  if (a === "cancelNo") return closeModal();
  if (a === "manualPrice") return manualModal();
  if (a === "manualReset") { W.manual = null; return renderWizard(); }
  if (a === "mpNo") return closeModal();
  if (a === "mpOk") {
    const v = +digits($("#mpVal").value), why = $("#mpWhy").value.trim(), er = $("#mpErr");
    if (!(v > 0)) { er.textContent = "Narxni kiriting"; return er.classList.remove("hidden"); }
    if (why.length < 3) { er.textContent = "Sababini yozing"; return er.classList.remove("hidden"); }
    W.manual = {uzs: Math.round(v / 1000) * 1000, reason: why}; closeModal(); renderWizard(); toast("Narx o'zgartirildi"); return;
  }
  if (a === "cancelYes") { closeModal(); W = freshW(); renderWizard(); window.scrollTo(0, 0); toast("Bekor qilindi"); return; }
  if (a === "next" && canNext()) { if (W.step === 3) return saveDeal(); W.step++; renderWizard(); window.scrollTo(0, 0); return; }
  if (a === "new") { W = freshW(); return renderWizard(); }
  if (a === "reloadStock") { t.disabled = true; try { await loadAll(); renderStockGrid(); renderCompare(); refreshNext(); toast("Ombor yangilandi"); } catch (er) { toast(errText(er), true); } t.disabled = false; return; }
  if (t.dataset.stock) { W.stockId = t.dataset.stock; renderStockGrid(); renderCompare(); return refreshNext(); }
  if (t.dataset.sf) { S.stockFilter = t.dataset.sf; return renderStock(); }
  if (t.dataset.scope) { S.stockScope = t.dataset.scope; return renderStock(); }
  if (t.dataset.sell) return openSale(t.dataset.sell);
  if (t.dataset.slt) { SALE.type = t.dataset.slt; return renderSale(); }
  if (a === "slCancel") { SALE = null; return closeModal(); }
  if (a === "slSave") return saveSale(t);
  if (t.dataset.af) { S.arzFilter = t.dataset.af; return renderArizalar(); }
  if (t.dataset.arzgo) { const x = S.arizalar.find(z => z.id === t.dataset.arzgo); if (x) startFromAriza(x); return; }
  if (t.dataset.arz) {
    const [id, st] = t.dataset.arz.split("|"); t.disabled = true;
    try { await setArzStatus(id, st); renderArizalar(); toast("Ariza holati: " + ARZ_ST[st][0]); } catch (er) { t.disabled = false; toast(errText(er), true); }
    return;
  }
  if (a === "arzReload") { t.disabled = true; try { await loadAll(); renderArizalar(); toast("Arizalar yangilandi"); } catch (er) { toast(errText(er), true); } t.disabled = false; return; }
  if (a === "refresh") { t.disabled = true; try { await loadAll(); toast("Yangilandi"); } catch (er) { toast(errText(er), true); } t.disabled = false; return; }
  if (a === "logout") { W = freshW(); return signOut(auth); }
  if (a === "pwSave") {
    const err = $("#pErr"); err.classList.add("hidden");
    try {
      if ($("#pNew").value.length < 6) throw {message: "Yangi parol kamida 6 belgi bo'lsin"};
      await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(auth.currentUser.email, $("#pOld").value));
      await updatePassword(auth.currentUser, $("#pNew").value);
      $("#pOld").value = ""; $("#pNew").value = ""; toast("Parol o'zgartirildi");
    } catch (er) { err.textContent = errText(er); err.classList.remove("hidden"); }
  }
});
document.addEventListener("input", e => {
  const t = e.target, id = t.id;
  if (id === "mq") { W.mq = t.value; return renderModelList(); }
  if (id === "q2") { W.q2 = t.value; return renderStockGrid(); }
  if (id === "battR") { const v = +t.value; W.batt = v; $("#battN").value = v; t.style.setProperty("--p", ((v - 50) / 50 * 100).toFixed(1) + "%"); return; }
  if (id === "battN") { if (t.value === "") return; const v = Math.max(1, Math.min(100, Math.round(+t.value))); W.batt = v; const r = $("#battR"); r.value = Math.max(50, v); r.style.setProperty("--p", ((Math.max(50, v) - 50) / 50 * 100).toFixed(1) + "%"); return; }
  if (id === "imei") { W.imei = digits(t.value).slice(0, 15); t.value = W.imei; t.classList.toggle("err", W.imei.length > 0 && W.imei.length < 15); return; }
  if (id === "mRange") { W.months = +t.value; t.style.setProperty("--p", rngPct(W.months)); $("#mRangeVal").textContent = W.months + " oy"; $("#planBox").innerHTML = planHtml(diffUzs()); return; }
  if (id === "stockQ") { S.stockQ = t.value; $("#stockList").innerHTML = stockListHtml(stockItems()); return; }
  if (id === "slPrice") { SALE.price = +t.value || 0; const sp = $("#slPlan"); if (sp) sp.innerHTML = salePlanHtml(); return; }
  if (id === "slRange") { SALE.months = +t.value; t.style.setProperty("--p", rngPct(SALE.months)); $("#slRangeVal").textContent = SALE.months + " oy"; $("#slPlan").innerHTML = salePlanHtml(); return; }
  if (id === "mpVal") { const v = +digits(t.value); t.value = v ? sum(v) : ""; return; }
  if (id === "slName") SALE.name = t.value;
  if (id === "slPhone") SALE.phone = t.value;
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "pShow") { $("#pOld").type = $("#pNew").type = t.checked ? "text" : "password"; return; }
  if (t.dataset.ph !== undefined && t.files?.[0]) {
    try { W.photos[t.dataset.ph] = await compress(t.files[0]); renderWizard(); } catch (er) { toast(er.message, true); }
  }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const map = {colorTxt: "colorOk", battN: "battOk", cycN: "cycOk"};
  if (map[e.target.id]) { e.preventDefault(); document.querySelector(`[data-act=${map[e.target.id]}]`)?.click(); }
});
</script>
</body>
</html>
